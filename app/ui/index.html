<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Emuladores</title>
  <link rel="stylesheet" href="style.css">
  <script>
    /* Define o tema antes de a página aparecer (evita piscar): escolha salva, senão o tema do Windows. */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div class="app">
    <!-- menu lateral: navegação, atualizar catálogo e tema -->
    <aside class="sidebar">
      <div class="side-brand">
        <svg viewBox="0 0 48 32" width="30" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="44" height="26" rx="9"/><path d="M14 11v10M9 16h10"/>
          <circle cx="33" cy="13.5" r="2"/><circle cx="38" cy="19" r="2"/>
        </svg>
        <span class="nav-label">Gerenciador<br>de Emuladores</span>
      </div>

      <nav class="side-nav" aria-label="Principal">
        <button class="nav-item" id="nav-home" type="button" title="Início">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
          <span class="nav-label">Início</span>
        </button>
        <p class="nav-title nav-label">Emuladores</p>
        <div id="nav-emus"></div>
      </nav>

      <div class="side-foot">
        <button class="nav-item update" id="update" type="button" title="Baixar a versão nova" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span class="nav-label" id="update-label"></span>
        </button>
        <button class="nav-item" id="refresh" type="button" title="Atualizar catálogo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          <span class="nav-label" id="refresh-label">Atualizar catálogo</span>
        </button>
        <button class="nav-item theme" id="theme" type="button" aria-label="Trocar para o tema escuro" title="Trocar tema">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          <span class="nav-label">Trocar tema</span>
        </button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar"><nav class="crumbs" id="crumbs" aria-label="Onde você está"></nav></header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
