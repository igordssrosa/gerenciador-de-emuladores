<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Emuladores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" type="button" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="back-label">Emuladores</span>
    </button>
    <span class="brand" id="brand">Gerenciador de Emuladores</span>
    <div class="actions">
      <button class="ghost update" id="update" type="button" hidden></button>
      <button class="ghost" id="refresh" type="button">Atualizar catálogo</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
